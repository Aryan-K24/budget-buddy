<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("bb-theme");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Extra Funds | Budget Buddy</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="extra_funds.css" />
  <link rel="stylesheet" href="dark-theme.css">
</head>

<body>
  <div class="dashboard">

    <nav class="navbar">
      <div class="logo">
        Budget Buddy
        <p class="tagline">Your Personal Finance Overview</p>
      </div>
      <div class="menu-toggle" id="menuToggle">☰</div>

      <ul class="nav-links" id="mainNav">
        <li><a href='/dashboard'>Dashboard</a></li>
        <li><a href='/expense'>Expenses</a></li>
        <li><a href='/history'>History</a></li>
        <li><a href='/payments'>Payments</a></li>
        <li><a href='/savings_planner'>Savings Planner</a></li>
        <li class="active"><a href='/extra_funds'>Extra Funds</a></li>
        <li class="icon-link"><a href='/settings' title='Settings'>⚙️</a></li>
        <li class="icon-link"><a href="#" id="logoutBtn" title="Logout">⏻</a></li>
      </ul>
    </nav>

    <h2 class="page-title">Extra Funds</h2>

    <section class="box">
      <form class="extra-form">
        <input type="text" inputmode="decimal" id="extra-amount" placeholder="Amount" required />
        <input type="text" id="extra-note" placeholder="Note (optional)" />
        <button type="submit">Add Funds</button>
      </form>
    </section>

    <section class="box">
      <h2>Recent Extra Funds</h2>
      <div id="extraFundsList"></div>
    </section>

  </div><!-- /.dashboard -->

  <!-- ── BOTTOM NAV (mobile only) ── -->
  <nav class="bottom-nav">
    <button class="bn-btn" id="bn-home" onclick="location.href='dashboard.html'">
      <span class="bn-icon">🏠</span>
      <span class="bn-label">Home</span>
    </button>
    <button class="bn-btn" id="bn-expenses" onclick="location.href='expense.html'">
      <span class="bn-icon">💸</span>
      <span class="bn-label">Expenses</span>
    </button>
    <button class="bn-btn" id="bn-history" onclick="location.href='history.html'">
      <span class="bn-icon">🕐</span>
      <span class="bn-label">History</span>
    </button>
    <button class="bn-btn" id="bn-payments" onclick="location.href='payments.html'">
      <span class="bn-icon">💳</span>
      <span class="bn-label">Payments</span>
    </button>
    <button class="bn-btn" id="bn-more">
      <span class="bn-icon">•••</span>
      <span class="bn-label">More</span>
    </button>
  </nav>

  <div class="bn-overlay" id="bn-overlay"></div>

  <div class="bn-more-sheet" id="bn-more-sheet">
    <div class="bn-sheet-handle"></div>
    <div class="bn-sheet-title">More</div>
    <a class='bn-sheet-item' href='/savings_planner'>
      <div class="bn-sheet-icon">📊</div>
      Savings Planner
    </a>
    <a class='bn-sheet-item' href='/extra_funds'>
      <div class="bn-sheet-icon">💰</div>
      Extra Funds
    </a>
    <a class='bn-sheet-item' href='/settings'>
      <div class="bn-sheet-icon">⚙️</div>
      Settings
    </a>
    <button class="bn-sheet-item bn-logout-item" id="bn-logout">
      <div class="bn-sheet-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 17l5-5-5-5"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        </svg>
      </div>
      Logout
    </button>
  </div>

  <script type="module" src="extra_funds.js"></script>
  <script type="module" src="bottom-nav.js"></script>
</body>
</html>
