<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline | Budget Buddy</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    .offline-container {
      text-align: center;
      padding: 2.5rem 2rem;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(124, 58, 237, 0.12);
      max-width: 360px;
      width: 90%;
    }

    .offline-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    .offline-title {
      font-family: 'Sora', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 0.5rem;
    }

    .offline-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      line-height: 1.6;
    }

    .retry-btn {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 100px;
      font-family: 'Sora', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
      transition: background 0.2s, transform 0.15s;
    }

    .retry-btn:hover {
      background: var(--purple-dark);
      transform: translateY(-1px);
    }

    .app-name {
      margin-top: 2rem;
      font-family: 'Sora', sans-serif;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1 class="offline-title">You're Offline</h1>
    <p class="offline-subtitle">
      Budget Buddy needs an internet connection to sync your data.
      Please check your connection and try again.
    </p>
    <button class="retry-btn" onclick="handleRetry()">Try Again</button>
    <script>
      function handleRetry() {
        if (navigator.onLine) {
          window.location.href = "/dashboard.html";
        } else {
          const btn = document.querySelector(".retry-btn");
          btn.innerText = "Still offline...";
          btn.style.background = "#6b7280";
          setTimeout(() => {
            btn.innerText = "Try Again";
            btn.style.background = "";
          }, 2000);
        }
      }

      // Auto-redirect when connection comes back
      window.addEventListener("online", () => {
        window.location.href = "/dashboard.html";
      });
    </script>
    <p class="app-name">Budget Buddy</p>
  </div>
</body>
</html>
