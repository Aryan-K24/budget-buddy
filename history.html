<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History | Budget Buddy</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="history.css" />
</head>

<body data-page="history">
  <div class="dashboard">

    <nav class="navbar">
      <div class="logo">
        Budget Buddy
        <p class="tagline">Your Personal Finance Overview</p>
      </div>
      <div class="menu-toggle" id="menuToggle">☰</div>

      <ul class="nav-links" id="mainNav">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="expense.html">Expenses</a></li>
        <li class="active"><a href="history.html">History</a></li>
        <li><a href="payments.html">Payments</a></li>
        <li><a href="savings_planner.html">Savings Planner</a></li>
        <li><a href="extra_funds.html">Extra Funds</a></li>
        <li class="icon-link"><a href="settings.html" title="Settings">⚙️</a></li>
        <li class="icon-link"><a href="#" id="logoutBtn" title="Logout">⏻</a></li>
      </ul>
    </nav>

    <h2 class="page-title">Expense History</h2>

    <section class="box history-filters">
      <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option>Food &amp; Dining</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Entertainment</option>
        <option>Health</option>
        <option>Education</option>
        <option>Investments (SIP)</option>
        <option>Loans / EMI</option>
        <option>Other</option>
      </select>
      <input type="month" id="monthFilter" />
    </section>

    <section class="box monthly-review hidden" id="monthlyReview"></section>

    <section class="box">
      <div class="history-list" id="historyList"></div>
    </section>

  </div><!-- /.dashboard -->

  <!-- ── BOTTOM NAV (mobile only) ── -->
  <nav class="bottom-nav">
    <button class="bn-btn" id="bn-home" onclick="location.href='dashboard.html'">
      <span class="bn-icon">🏠</span>
      <span class="bn-label">Home</span>
    </button>
    <button class="bn-btn" id="bn-expenses" onclick="location.href='expense.html'">
      <span class="bn-icon">💸</span>
      <span class="bn-label">Expenses</span>
    </button>
    <button class="bn-btn" id="bn-history" onclick="location.href='history.html'">
      <span class="bn-icon">🕐</span>
      <span class="bn-label">History</span>
    </button>
    <button class="bn-btn" id="bn-payments" onclick="location.href='payments.html'">
      <span class="bn-icon">💳</span>
      <span class="bn-label">Payments</span>
    </button>
    <button class="bn-btn" id="bn-more">
      <span class="bn-icon">•••</span>
      <span class="bn-label">More</span>
    </button>
  </nav>

  <div class="bn-overlay" id="bn-overlay"></div>

  <div class="bn-more-sheet" id="bn-more-sheet">
    <div class="bn-sheet-handle"></div>
    <div class="bn-sheet-title">More</div>
    <a href="savings_planner.html" class="bn-sheet-item">
      <div class="bn-sheet-icon">📊</div>
      Savings Planner
    </a>
    <a href="extra_funds.html" class="bn-sheet-item">
      <div class="bn-sheet-icon">💰</div>
      Extra Funds
    </a>
    <a href="settings.html" class="bn-sheet-item">
      <div class="bn-sheet-icon">⚙️</div>
      Settings
    </a>
    <button class="bn-sheet-item bn-logout-item" id="bn-logout">
      <div class="bn-sheet-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 17l5-5-5-5"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        </svg>
      </div>
      Logout
    </button>
  </div>

  <script type="module" src="history.js"></script>
  <script type="module" src="bottom-nav.js"></script>
</body>
</html>
