<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login | Budget Buddy</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="auth.css" />
  <style>
    .fp-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 9000;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      align-items: flex-end;
      justify-content: center;
    }
    .fp-overlay.open { display: flex; }

    @media (min-width: 500px) {
      .fp-overlay.open { align-items: center; }
      .fp-sheet { border-radius: 24px; margin: 1rem; padding: 24px; }
      .fp-handle { display: none; }
    }

    .fp-sheet {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 420px;
      padding: 12px 0 32px;
      box-shadow: 0 -8px 40px rgba(124,58,237,0.15);
      animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1) both;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .fp-handle {
      width: 40px; height: 4px;
      background: #e2e8f0; border-radius: 4px;
      margin: 0 auto 16px;
    }

    .fp-inner { padding: 0 24px; }

    .fp-title {
      font-family: 'Sora', sans-serif;
      font-size: 1.05rem; font-weight: 700;
      color: #1e1b4b; margin-bottom: 6px;
    }

    .fp-sub {
      font-size: 0.82rem; color: #9ca3af;
      margin-bottom: 1rem; line-height: 1.5;
    }

    .fp-input {
      width: 100%; padding: 0.85rem 1rem;
      border-radius: 12px; border: 1.5px solid #e2e8f0;
      font-size: 16px; font-family: 'DM Sans', sans-serif;
      background: #fafbff; color: #1e1b4b;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 0.875rem;
    }
    .fp-input:focus {
      outline: none; border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
    }

    .fp-btns { display: flex; gap: 10px; }

    .fp-cancel {
      flex: 1; padding: 0.85rem;
      border-radius: 100px; border: 1.5px solid #e2e8f0;
      background: #fff; color: #6b7280;
      font-family: 'Sora', sans-serif; font-size: 0.9rem;
      font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .fp-cancel:hover { background: #f8fafc; }

    .fp-send {
      flex: 1; padding: 0.85rem;
      border-radius: 100px; border: none;
      background: #7c3aed; color: #fff;
      font-family: 'Sora', sans-serif; font-size: 0.9rem;
      font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 12px rgba(124,58,237,0.3);
      transition: background 0.2s, transform 0.15s;
    }
    .fp-send:hover { background: #5b21b6; transform: translateY(-1px); }
    .fp-send:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="auth-container">
  <h1>Budget Buddy</h1>
  <p>Sign in to continue</p>

  <!-- Google Button -->
  <button id="googleBtn" type="button" style="
    width:100%; padding:0.75rem; border-radius:100px;
    border:1.5px solid #e2e8f0; background:#fff;
    font-family:'Sora',sans-serif; font-size:0.9rem; font-weight:600;
    color:#1e1b4b; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:10px; margin-bottom:1rem;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    transition:box-shadow 0.2s, transform 0.15s;
  ">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" />
    Continue with Google
  </button>

  <!-- Divider -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem;">
    <div style="flex:1;height:1px;background:#e2e8f0;"></div>
    <span style="font-size:0.8rem;color:#9ca3af;">or</span>
    <div style="flex:1;height:1px;background:#e2e8f0;"></div>
  </div>

  <!-- Email form -->
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email address" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Continue</button>
  </form>

  <div class="auth-links">
    <p><a href="#" id="forgotPassword">Forgot password?</a></p>
    <p>Don't have an account? <a href='/register'>Create one</a></p>
  </div>
</div>

<!-- ── Forgot Password Modal ── -->
<div class="fp-overlay" id="fpOverlay">
  <div class="fp-sheet">
    <div class="fp-handle"></div>
    <div class="fp-inner">
      <div class="fp-title">Reset Password</div>
      <div class="fp-sub">Enter your email and we'll send you a reset link.</div>
      <input type="email" class="fp-input" id="fpEmail" placeholder="Email address" />
      <div class="fp-btns">
        <button class="fp-cancel" id="fpCancel" type="button">Cancel</button>
        <button class="fp-send"   id="fpSend"   type="button">Send Link</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Modal open/close — no JS imports needed here, pure DOM
  const overlay = document.getElementById('fpOverlay');
  const fpEmail = document.getElementById('fpEmail');

  document.getElementById('forgotPassword').addEventListener('click', e => {
    e.preventDefault();
    fpEmail.value = '';
    overlay.classList.add('open');
    setTimeout(() => fpEmail.focus(), 300);
  });

  function closeModal() {
    overlay.classList.remove('open');
  }

  document.getElementById('fpCancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
</script>

<script type="module" src="login.js"></script>
</body>
</html>
